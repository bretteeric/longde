<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相片集｜國際佛光會 龍德分會</title>
<meta name="description" content="龍德分會活動相片集，瀏覽分會法會、共修、公益與活動紀錄。">
<meta name="theme-color" content="#7b2d26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%237b2d26'/%3E%3Cpath d='M24 11c3.9 3.6 5.9 7.7 5.9 12.2 0 4.5-2 8.6-5.9 12.2-3.9-3.6-5.9-7.7-5.9-12.2C18.1 18.7 20.1 14.6 24 11z' fill='%23f2e4c4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.gallery-album{background:#fffdf9;border:1px solid #e7ddcd;border-radius:18px;padding:22px;margin-bottom:24px;box-shadow:0 1px 2px rgba(58,38,25,.05),0 12px 28px -18px rgba(58,38,25,.35)}
.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.gallery-head h3{font-family:Georgia,"Noto Serif TC",serif;font-size:21px;margin:0}
.gallery-head span{font-size:12.5px;color:#9c8d83}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gallery-item{display:block;background:#f5eee2;border:1px solid #e7ddcd;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit}
.gallery-item:hover{text-decoration:none;border-color:#c39b4e}
.gallery-item img{width:100%;height:180px;object-fit:cover}
.gallery-item span{display:block;padding:8px 10px;font-size:12.5px;color:#6f6058;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body data-page="gallery">
<a href="#main" class="sr-only">跳到主要內容</a>
<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="index.html">
      <span class="brand-text">
        <span class="brand-name">國際佛光會 龍德分會</span>
        <span class="brand-sub">LONGDE · 活動公告</span>
      </span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" aria-controls="site-nav">☰</button>
    <nav class="nav" id="site-nav">
      <a href="index.html">首頁</a>
      <a href="activities.html">活動公告</a>
      <a href="gallery.html">相片集</a>
      <a href="calendar.html">行事曆</a>
      <a href="about.html">關於分會</a>
    </nav>
  </div>
</header>
<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">首頁</a> ／ 相片集</div>
      <div class="section-head" style="margin-bottom:14px">
        <h2>相片集<span>PHOTO GALLERIES</span></h2>
        <span class="more" id="gallery-count" style="color:var(--ink-faint)"></span>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div id="gallery-list"><div class="empty">正在載入相片集…</div></div>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div style="font-family:var(--font-serif);font-weight:700;font-size:16px">國際佛光會 龍德分會</div>
        <p style="margin-top:10px">以文化弘揚佛法，以教育培養人才，<br>以慈善福利社會，以共修淨化人心。</p>
      </div>
      <div>
        <h4>網站導覽</h4>
        <p><a href="index.html">首頁</a></p>
        <p><a href="activities.html">活動公告</a></p>
        <p><a href="gallery.html">相片集</a></p>
        <p><a href="calendar.html">行事曆</a></p>
      </div>
      <div>
        <h4>相片原則</h4>
        <p>僅公開經授權的活動相片</p>
        <p>不公開個人名單與捐款明細</p>
      </div>
    </div>
  </div>
</footer>
<script>
(function () {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const box = document.getElementById("gallery-list");
  const count = document.getElementById("gallery-count");
  fetch("data/albums.json", { cache: "no-store" })
    .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then((data) => {
      const albums = data.albums || [];
      if (count) count.textContent = albums.length ? `共 ${albums.length} 個相片集` : "目前尚無相片集";
      if (!albums.length) {
        box.innerHTML = '<div class="empty">目前尚未建立公開相片集。</div>';
        return;
      }
      box.innerHTML = albums.map((album) => {
        const images = (album.images || []).map((image) =>
          '<a class="gallery-item" href="' + esc(image.src) + '" target="_blank" rel="noopener">' +
          '<img src="' + esc(image.src) + '" alt="' + esc(image.title) + '" loading="lazy">' +
          '<span>' + esc(image.title) + "</span></a>"
        ).join("");
        return '<section class="gallery-album"><div class="gallery-head"><h3>' + esc(album.title) + '</h3><span>' + (album.images || []).length + " 張相片</span></div><div class=\"gallery-grid\">" + images + "</div></section>";
      }).join("");
    })
    .catch(() => { if (box) box.innerHTML = '<div class="empty">相片集資料暫時無法載入。</div>'; });
})();
</script>
</body>
</html>
